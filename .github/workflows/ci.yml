name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run tests
        run: python -m pytest

      - name: Training smoke
        env:
          MPLBACKEND: Agg
        run: python scripts/train.py --n-samples 120 --skip-mlflow

      - name: Reproduce laboratory scripts
        env:
          MPLBACKEND: Agg
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: python scripts/run_all.py

      # Docker is not built here. A GHA docker build without buildx cache
      # is slow and is not a check of training-serving parity (that check is
      # pytest). Local image instructions: docs/api_contract.md.
