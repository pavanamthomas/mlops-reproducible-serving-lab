name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run tests
        run: python -m pytest

      - name: Training smoke and offline parity artifact
        env:
          MPLBACKEND: Agg
        run: python scripts/train.py --n-samples 400 --skip-mlflow --artifact-dir ci_models

      - name: Reproduce laboratory scripts
        env:
          MPLBACKEND: Agg
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: python scripts/run_all.py

      - name: Build serving image
        run: docker build -t mlserv-parity-ci .

      - name: Check container prediction parity
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -d --name mlserv-parity-ci -p 8000:8000 mlserv-parity-ci
          trap 'docker logs mlserv-parity-ci || true; docker stop mlserv-parity-ci >/dev/null 2>&1 || true' EXIT
          python scripts/check_container_parity.py \
            --artifact ci_models/bundle.joblib \
            --base-url http://127.0.0.1:8000 \
            --tolerance 1e-10
